<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos - Control de Vacaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            color: #333;
        }

        main {
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .info {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .info p {
            margin: 5px 0;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }

        .btn-insertar { background-color: #4a90e2; margin-bottom: 15px; }
        .btn-volver { background-color: #999; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #f0f2f5;
        }
    </style>
</head>
<body>

    <h1>Movimientos del Empleado</h1>

    <main>
        <div class="info">
            <p><strong>Documento:</strong> <!--DOC_ID--></p>
            <p><strong>Nombre:</strong> <!--NOMBRE--></p>
            <p><strong>Saldo Vacaciones:</strong> <!--SALDO--></p>
        </div>

        <form action="/insertar_movimiento" method="GET" style="display:inline">
            <input type="hidden" name="doc_id" value="<!--DOC_ID_VAL-->" />
            <button class="btn-insertar">Insertar Movimiento</button>
        </form>
        <form action="/home" method="GET" style="display:inline">
            <button class="btn-volver">Volver</button>
        </form>

        <table>
            <tr>
                <th>Fecha</th>
                <th>Tipo Movimiento</th>
                <th>Monto</th>
                <th>Nuevo Saldo</th>
                <th>Usuario</th>
                <th>IP</th>
                <th>Fecha Registro</th>
            </tr>
            <!--FILAS-->
        </table>
    </main>

</body>
</html>
