<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar Movimiento - Control de Vacaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            color: #333;
        }

        main {
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 400px;
        }

        .info {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .info p {
            margin: 5px 0;
        }

        label {
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        select:focus, input:focus {
            border-color: #4a90e2;
            outline: none;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }

        .btn-insertar { background-color: #4a90e2; }
        .btn-volver { background-color: #999; }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Insertar Movimiento</h1>

    <main>
        <div class="info">
            <p><strong>Documento:</strong> <!--DOC_ID--></p>
            <p><strong>Nombre:</strong> <!--NOMBRE--></p>
            <p><strong>Saldo Vacaciones:</strong> <!--SALDO--></p>
        </div>

        <form action="/insertar_movimiento" method="POST">
            <input type="hidden" name="doc_id" value="<!--DOC_ID_VAL-->" />

            <label>Tipo de Movimiento</label>
            <select name="tipo_movimiento" required>
                <!--OPCIONES-->
            </select>

            <label>Monto</label>
            <input type="number" name="monto" min="1" required />

            <button type="submit" class="btn-insertar">Insertar</button>
            <a href="/home"><button type="button" class="btn-volver">Cancelar</button></a>
        </form>

        <p class="error" id="error"><!--ERROR--></p>
    </main>

</body>
</html>
