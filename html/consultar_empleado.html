<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Empleado - Control de Vacaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            color: #333;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        main {
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 450px;
        }

        h2 {
            font-size: 15px;
            margin-bottom: 15px;
            color: #333;
        }

        .campo {
            margin-bottom: 12px;
        }

        .campo label {
            font-size: 13px;
            color: #666;
            display: block;
        }

        .campo span {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: white;
            margin-top: 10px;
        }

        .btn-volver { background-color: #999; }
        .btn-volver:hover { background-color: #777; }
        .btn-logout { background-color: #999; }
    </style>
</head>
<body>

    <div class="top">
        <h1>Control de Vacaciones</h1>
        <form action="/logout" method="POST">
            <button type="submit" class="btn-logout">Cerrar Sesión</button>
        </form>
    </div>

    <main>
        <h2>Consultar Empleado</h2>

        <div class="campo">
            <label>Documento de Identidad</label>
            <span><!--DOC_ID--></span>
        </div>

        <div class="campo">
            <label>Nombre</label>
            <span><!--NOMBRE--></span>
        </div>

        <div class="campo">
            <label>Puesto</label>
            <span><!--PUESTO--></span>
        </div>

        <div class="campo">
            <label>Saldo de Vacaciones</label>
            <span><!--SALDO--></span>
        </div>

        <button type="button" class="btn-volver" onclick="window.location.href='/home'">Volver</button>
    </main>

</body>
</html>
